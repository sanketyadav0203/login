<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f0f2f5;
        }

        .login-box{
            background:#fff;
            padding:30px;
            width:350px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        .login-box h2{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .input-box{
            margin-bottom:15px;
        }

        .input-box input{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        .btn{
            width:100%;
            padding:10px;
            border:none;
            border-radius:5px;
            background:#007BFF;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .btn:hover{
            background:#0056b3;
        }

        .footer{
            text-align:center;
            margin-top:15px;
            font-size:14px;
        }

        .footer a{
            color:#007BFF;
            text-decoration:none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <form action="#" method="post">
        <div class="input-box">
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-box">
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn">Login</button>
    </form>

    <div class="footer">
        Don't have an account?
        <a href="#">Register</a>
    </div>
</div>

</body>
</html>
